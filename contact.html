<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | GAR WebGroup</title>
    <link rel="stylesheet" href="contact.css">
	<style>
        
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="container">
            <h1>GAR WebGroup</h1>
            <p>Get in touch with our team of web experts</p>
        </div>
    </header>

    <!-- Main Contact Section -->
    <section class="contact-section">
        <div class="container">
            <div class="contact-grid">
                
                <!-- Contact Form Component -->
                <div class="contact-form">
                    <h2>Send Us a Message</h2>
                    <form action="#" method="POST">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" name="name" placeholder="John Doe" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="john@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" name="subject" placeholder="Project Inquiry" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="message">Your Message</label>
                            <textarea id="message" name="message" rows="5" placeholder="Tell us about your project or inquiry..." required></textarea>
                        </div>
                        
                        <button type="submit" class="submit-btn">Send Message</button>
                    </form>
                </div>

                <!-- Contact Information Component -->
                <div class="contact-info">
                    <h2>Contact Information</h2>
                    
                    <div class="info-item">
                        <div class="icon">📍</div>
                        <div>
                            <h3>Our Office</h3>
                            <p> Tech Innovation Way<br>Tema, Community One</p>
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="icon">📞</div>
                        <div>
                            <h3>Call Us</h3>
                            <p>+233 (27) 849-7917</p>
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="icon">✉️</div>
                        <div>
                            <h3>Email Us</h3>
                            <p>garwebgroup@gmail.com</p>
                        </div>
                    </div>

                    <!-- Embedded Google Map Placeholder -->
                    <div class="map-container">
                        <iframe 
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3168.6392905788775!2d-122.14660468469247!3d37.44436797982121!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808fbc80d381c8b3%3A0x6b44788c67a36c93!2sPalo+Alto%2C+CA!5e0!3m2!1sen!2sus!4v1565304784982!5m2!1sen!2sus" 
                            allowfullscreen="" 
                            loading="lazy">
                        </iframe>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer Section -->
    <footer>
        <div class="container">
            <p>&copy; 2026 GAR WebGroup. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
