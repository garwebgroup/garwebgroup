<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Legon Hills</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .dashboard-layout {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background-color: var(--color-deep-teal);
            color: var(--color-light);
            padding: 2rem;
            position: fixed;
            height: 100%;
            overflow-y: auto;
        }
        .sidebar h2 {
            color: var(--color-light);
            margin-bottom: 2rem;
        }
        .sidebar ul {
            list-style: none;
            margin-bottom: 2rem;
        }
        .sidebar ul li {
            margin-bottom: 1rem;
        }
        .sidebar ul li a {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            border-radius: 8px;
            color: var(--color-light);
            text-decoration: none;
        }
        .sidebar ul li a:hover, .sidebar ul li a.active {
            background-color: var(--color-dark-teal);
        }
        .main-content {
            margin-left: 250px;
            padding: 3rem;
            width: 100%;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .form-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .form-row .form-group {
            flex: 1;
            min-width: 250px;
            margin-bottom: 0;
        }
        .crud-form {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow-subtle);
            margin-bottom: 2rem;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-subtle);
        }
        .data-table th, .data-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .data-table th {
            background-color: var(--color-light);
            color: var(--color-dark-teal);
            font-weight: 600;
        }
        .data-table tr:hover {
            background-color: #faf9f6;
        }
    </style>
</head>
<body style="background-color: var(--color-light);">

    <div class="dashboard-layout">
        <div class="sidebar">
            <h2 style="display: flex; align-items: center; gap: 0.5rem;"><i class="ph-fill ph-buildings"></i> Horizon</h2>
            
            <p style="font-size: 0.8rem; color: rgba(247, 245, 242, 0.7); margin-bottom: 0.5rem; text-transform: uppercase;">Tables</p>
            <ul id="sidebar-tables">
                <li><a href="#" onclick="changeTable('employees', this); return false;" class="active"><i class="ph-bold ph-users"></i> Employees</a></li>
                <li><a href="#" onclick="changeTable('users', this); return false;"><i class="ph-bold ph-shield-check"></i> System Users</a></li>
                <li><a href="#" onclick="changeTable('company_profile', this); return false;"><i class="ph-bold ph-buildings"></i> Company Profile</a></li>
                <li><a href="#" onclick="changeTable('contact_messages', this); return false;"><i class="ph-bold ph-envelope"></i> Contact Messages</a></li>
                <li><a href="#" onclick="changeTable('attendance', this); return false;"><i class="ph-bold ph-clock"></i> Attendance</a></li>
                <li><a href="#" onclick="changeTable('employeebank', this); return false;"><i class="ph-bold ph-bank"></i> Employee Bank</a></li>
                <li><a href="#" onclick="changeTable('helpdesk', this); return false;"><i class="ph-bold ph-headset"></i> Helpdesk</a></li>
                <li><a href="#" onclick="changeTable('payroll', this); return false;"><i class="ph-bold ph-money"></i> Payroll</a></li>
            </ul>

            <ul>
                <li><a href="index.html"><i class="ph-bold ph-house"></i> Go to Website</a></li>
                <li style="margin-top: 1rem;"><a href="#" id="logout-btn" style="color: #e74c3c;"><i class="ph-bold ph-sign-out"></i> Logout</a></li>
            </ul>
        </div>

        <div class="main-content">
            <div class="dashboard-header">
                <h1 id="dashboard-title">Information System Database</h1>
                <button id="btn-retrieve" class="btn-secondary"><i class="ph-bold ph-arrows-clockwise"></i> Refresh</button>
            </div>

            <!-- Add / Update Form -->
            <div class="crud-form">
                <h3 id="form-title" style="margin-bottom: 1.5rem;">Add New Record</h3>
                <form id="record-form">
                    <input type="hidden" id="record-id">
                    
                    <div id="dynamic-form-fields" class="form-row">
                        <!-- Form fields injected here via JS -->
                    </div>

                    <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                        <button type="submit" class="btn-primary" id="btn-save"><i class="ph-bold ph-floppy-disk"></i> Save Record</button>
                        <button type="button" class="btn-secondary" id="btn-cancel" style="display: none;">Cancel</button>
                    </div>
                    <p id="form-message" style="margin-top: 1rem; color: var(--color-dark-teal);"></p>
                </form>
            </div>

            <!-- Data Table -->
            <div style="overflow-x: auto;">
                <table class="data-table">
                    <thead id="dynamic-thead">
                        <!-- Headers injected here -->
                    </thead>
                    <tbody id="records-tbody">
                        <!-- Records will be injected here via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/api.js?v=3"></script>
    <script>
        // Check if user is logged in (Simple mock check for demonstration)
        if(!localStorage.getItem('hotel_user')) {
            window.location.href = 'auth.html';
        }
        
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('hotel_user');
            window.location.href = 'auth.html';
        });
    </script>
</body>
</html>
