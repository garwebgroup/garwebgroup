<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Legon Hills</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .dashboard-layout {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background-color: var(--color-deep-teal);
            color: var(--color-light);
            padding: 2rem;
            position: fixed;
            height: 100%;
        }
        .sidebar h2 {
            color: var(--color-light);
            margin-bottom: 2rem;
        }
        .sidebar ul {
            list-style: none;
        }
        .sidebar ul li {
            margin-bottom: 1rem;
        }
        .sidebar ul li a {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            border-radius: 8px;
        }
        .sidebar ul li a:hover {
            background-color: var(--color-dark-teal);
        }
        .main-content {
            margin-left: 250px;
            padding: 3rem;
            width: 100%;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .form-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        .crud-form {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow-subtle);
            margin-bottom: 2rem;
        }
    </style>
</head>
<body style="background-color: var(--color-light);">

    <div class="dashboard-layout">
        <div class="sidebar">
            <h2 style="display: flex; align-items: center; gap: 0.5rem;"><i class="ph-fill ph-buildings"></i> Horizon</h2>
            <ul>
                <li><a href="#" class="active"><i class="ph-bold ph-database"></i> Database</a></li>
                <li><a href="index.html"><i class="ph-bold ph-house"></i> Go to Website</a></li>
                <li style="margin-top: 2rem;"><a href="#" id="logout-btn" style="color: #e74c3c;"><i class="ph-bold ph-sign-out"></i> Logout</a></li>
            </ul>
        </div>

        <div class="main-content">
            <div class="dashboard-header">
                <h1>Information System Database</h1>
                <button id="btn-retrieve" class="btn-secondary"><i class="ph-bold ph-arrows-clockwise"></i> Retrieve Records</button>
            </div>

            <!-- Add / Update Form -->
            <div class="crud-form">
                <h3 id="form-title" style="margin-bottom: 1.5rem;">Add New Record</h3>
                <form id="record-form">
                    <input type="hidden" id="record-id">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Name / Title</label>
                            <input type="text" id="record-name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Email / Contact</label>
                            <input type="text" id="record-email" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Department</label>
                            <input type="text" id="record-department" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Position</label>
                            <input type="text" id="record-position" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="text" id="record-phone" class="form-control" required>
                        </div>
                    </div>
                    <div style="display: flex; gap: 1rem;">
                        <button type="submit" class="btn-primary" id="btn-save"><i class="ph-bold ph-floppy-disk"></i> Save Record</button>
                        <button type="button" class="btn-secondary" id="btn-cancel" style="display: none;">Cancel</button>
                    </div>
                    <p id="form-message" style="margin-top: 1rem; color: var(--color-dark-teal);"></p>
                </form>
            </div>

            <!-- Data Table -->
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Contact Email</th>
                        <th>Department</th>
                        <th>Position</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="records-tbody">
                    <!-- Records will be injected here via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Check if user is logged in (Simple mock check for demonstration)
        if(!localStorage.getItem('hotel_user')) {
            window.location.href = 'auth.html';
        }
        
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('hotel_user');
            window.location.href = 'auth.html';
        });
    </script>
</body>
</html>
