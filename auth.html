<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register - Legon Hills Hotel</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            background-color: var(--color-deep-teal);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: var(--font-body);
        }
        
        .navbar {
            background: transparent !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
        }
        
        .navbar a {
            color: var(--color-light) !important;
        }

        .auth-card-container {
            display: flex;
            width: 900px;
            max-width: 95%;
            min-height: 600px;
            background-color: var(--color-deep-teal);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-top: 50px;
        }

        .auth-image {
            flex: 1;
            background-image: url('images/slide1.png');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .auth-forms-wrapper {
            flex: 1;
            padding: 4rem 3rem;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .auth-form-container {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
            flex: 1;
        }
        
        .auth-form-container.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .auth-header {
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .auth-header i {
            font-size: 2rem;
            color: var(--color-light);
            margin-bottom: 1rem;
            display: block;
        }

        .auth-header h2 {
            font-family: var(--font-heading);
            color: var(--color-light);
            font-size: 1.8rem;
            margin: 0;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            color: var(--color-light);
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            font-weight: 300;
        }

        .form-control {
            background-color: var(--color-dark-teal);
            border: none;
            color: var(--color-light);
            padding: 0.9rem;
            border-radius: 4px;
        }
        
        .form-control::placeholder {
            color: rgba(247, 245, 242, 0.5);
            font-size: 0.85rem;
        }

        .form-control:focus {
            box-shadow: 0 0 0 2px var(--color-accent);
            border: none;
        }

        .btn-auth {
            background-color: var(--color-accent);
            color: var(--color-deep-teal);
            border: none;
            padding: 0.9rem;
            width: 100%;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 1rem;
        }

        .btn-auth:hover {
            opacity: 0.9;
        }

        .social-login {
            text-align: center;
            margin-top: 2rem;
        }
        
        .social-login p {
            color: var(--color-light);
            font-size: 0.8rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .social-login p::before, .social-login p::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: rgba(247, 245, 242, 0.2);
        }
        
        .social-login p::before { left: 0; }
        .social-login p::after { right: 0; }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
        
        .social-icons i {
            color: var(--color-light);
            background-color: rgba(247, 245, 242, 0.1);
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
        }

        .social-icons i:hover {
            background-color: rgba(247, 245, 242, 0.3);
        }

        .toggle-link {
            text-align: center;
            margin-top: auto;
            padding-top: 2rem;
            font-size: 0.85rem;
            color: rgba(247, 245, 242, 0.7);
        }

        .toggle-link a {
            color: var(--color-accent);
            font-weight: 500;
            cursor: pointer;
            margin-left: 0.3rem;
        }
        
        .toggle-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <nav class="navbar" style="position: fixed; top: 0; width: 100%; padding: 1.5rem 5%;">
        <a href="index.html" class="logo"><i class="ph-fill ph-buildings" style="color:var(--color-accent);"></i> Legon Hills Hotel</a>
    </nav>

    <div class="auth-card-container">
        <!-- Left Image Section -->
        <div class="auth-image"></div>
        
        <!-- Right Forms Section -->
        <div class="auth-forms-wrapper">
            
            <!-- Login Form -->
            <div id="login-container" class="auth-form-container active">
                <div class="auth-header">
                    <i class="ph-bold ph-paper-plane-tilt"></i>
                    <h2>Welcome back</h2>
                </div>
                <form id="login-form">
                    <div class="form-group">
                        <label>Email address:</label>
                        <input type="email" id="login-email" class="form-control" placeholder="Example@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password:</label>
                        <input type="password" id="login-password" class="form-control" placeholder="Example@gmail.com" required>
                    </div>
                    <button type="submit" class="btn-auth">Sign in</button>
                    <p id="login-message" style="margin-top: 0.5rem; color: #e74c3c; text-align: center; font-size: 0.85rem;"></p>
                </form>
                
                <div class="social-login">
                    <p>Or</p>
                    <div class="social-icons">
                        <i class="ph-fill ph-google-logo"></i>
                        <i class="ph-fill ph-twitter-logo"></i>
                        <i class="ph-fill ph-facebook-logo"></i>
                    </div>
                </div>

                <div class="toggle-link">
                    Don't have an account? <a onclick="toggleForms('register')">Sign up</a>
                </div>
            </div>
            
            <!-- Registration Form -->
            <div id="register-container" class="auth-form-container">
                <div class="auth-header">
                    <i class="ph-bold ph-paper-plane-tilt"></i>
                    <h2>Create an Account</h2>
                </div>
                <form id="register-form">
                    <div class="form-group">
                        <label>Full name:</label>
                        <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Email address:</label>
                        <input type="email" id="reg-email" class="form-control" placeholder="Example@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password:</label>
                        <input type="password" id="reg-password" class="form-control" placeholder="Example@gmail.com" required>
                    </div>
                    <button type="submit" class="btn-auth">Sign up</button>
                    <p id="reg-message" style="margin-top: 0.5rem; text-align: center; font-size: 0.85rem;"></p>
                </form>

                <div class="social-login">
                    <p>Or</p>
                    <div class="social-icons">
                        <i class="ph-fill ph-google-logo"></i>
                        <i class="ph-fill ph-twitter-logo"></i>
                        <i class="ph-fill ph-facebook-logo"></i>
                    </div>
                </div>

                <div class="toggle-link">
                    Already have an account? <a onclick="toggleForms('login')">Sign in</a>
                </div>
            </div>

        </div>
    </div>

    <script>
        function toggleForms(formType) {
            const loginContainer = document.getElementById('login-container');
            const registerContainer = document.getElementById('register-container');
            
            document.getElementById('login-message').textContent = '';
            document.getElementById('reg-message').textContent = '';

            if (formType === 'register') {
                loginContainer.classList.remove('active');
                registerContainer.classList.add('active');
                document.title = "Register - Legon Hills Hotel";
            } else {
                registerContainer.classList.remove('active');
                loginContainer.classList.add('active');
                document.title = "Login - Legon Hills Hotel";
            }
        }
    </script>
    <script src="js/main.js"></script>
    <script src="js/api.js?v=3"></script>
</body>
</html>
